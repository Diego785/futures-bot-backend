# Despliegue AISLADO del paper-test (gate #7, P.4). Regla Cero: shadow read-only, mercado público.
# NO toca el v1 ni ningún otro servicio: contenedores, red, base de datos y puerto PROPIOS.
#
#   cp .env.paper.example .env.paper   # y rellenar (DB_PASS nuevo, PORT, símbolos)
#   docker compose -f docker-compose.paper.yml up -d --build
#   # backfill (una vez) + verificar; el reloj del gate se enciende fijando PAPER_CLOCK_START.
services:
  postgres:
    image: postgres:16
    container_name: futures-bot-v2-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - v2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 12
    # Sin puerto al host: el app llega por la red docker (inspección: docker compose exec postgres psql).

  app:
    image: node:22
    container_name: futures-bot-v2
    restart: always
    working_dir: /app
    volumes:
      - ./:/app
    env_file: .env.paper
    environment:
      DB_HOST: postgres # el app alcanza la DB por el hostname del servicio (red docker)
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${PORT}:${PORT}'
    # Instala, compila, migra (idempotente) y arranca. En reinicio re-instala/compila (robusto, lento).
    command: sh -c "npm ci && npm run build && npm run migration:run && node dist/main"

volumes:
  v2_pgdata:
