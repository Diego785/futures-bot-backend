# v2 (copiloto SMC) — paper-test del gate #7. Reusa el MISMO contenedor/puerto/proyecto que el v1.
# Sin Redis (el v2 no usa BullMQ). La base de datos es externa (postgres-db existente, database
# 'futures_bot_v2' propia → ver .env). Regla Cero: shadow read-only, mercado público (sin credenciales).
#
#   cp .env.paper.example .env   # y rellenar DB_PASS (= el del postgres-db) y símbolos
#   docker compose up -d         # instala, compila, migra (idempotente) y arranca el paper
services:
  futures-bot-backend:
    image: node:22
    container_name: futures-bot-backend
    hostname: futures-bot-backend
    restart: always
    volumes:
      - ./:/app
    working_dir: /app
    env_file: .env
    environment:
      - TZ=America/La_Paz
    # Instala (con devDeps: nest-cli compila), compila, migra (idempotente) y arranca. --include=dev
    # fuerza devDeps pese a NODE_ENV=production (sin ellas 'nest build' no existe). Si npm ci falla
    # (lock con alguna versión que el registro público no tenga), cae a un install fresco que se auto-cura.
    command: >
      sh -c "(npm ci --include=dev --no-audit --no-fund || (rm -f package-lock.json && npm install --include=dev --no-audit --no-fund))
      && npm run build
      && npx typeorm migration:run -d dist/data-source.js
      && node dist/main"
    ports:
      - '${PORT}:${PORT}'
